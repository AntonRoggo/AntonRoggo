<title>Anton Edit Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an edit-suite review room. Scripts on the left, the vertical cut in the middle, timestamped notes on the right; stacks to one column on a phone. */
:root {
  --bg: #0d0e12; --panel: #14161c; --raise: #1c1f27; --line: #262a34; --fg: #e9eaf0; --mute: #8a8f9d;
  --note: #f2b544; --ok: #3fcf8e; --work: #79a8ff; --danger: #ff7a7a; --on-accent: #0b0d10;
  --note-soft: rgba(242,181,68,.14); --ok-soft: rgba(63,207,142,.14); --work-soft: rgba(121,168,255,.14);
  --f-ui: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f4f7; --panel: #ffffff; --raise: #eceef3; --line: #d9dce4; --fg: #14161c; --mute: #5c6170;
  --note: #a86a00; --ok: #11804f; --work: #2a62d6; --danger: #c33232; --on-accent: #ffffff;
  --note-soft: rgba(168,106,0,.12); --ok-soft: rgba(17,128,79,.12); --work-soft: rgba(42,98,214,.12);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f4f7; --panel: #ffffff; --raise: #eceef3; --line: #d9dce4; --fg: #14161c; --mute: #5c6170;
  --note: #a86a00; --ok: #11804f; --work: #2a62d6; --danger: #c33232; --on-accent: #ffffff;
  --note-soft: rgba(168,106,0,.12); --ok-soft: rgba(17,128,79,.12); --work-soft: rgba(42,98,214,.12);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-ui); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--work); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.brand small { color: var(--mute); font-weight: 500; margin-left: 6px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--mute); }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab .n { font-family: var(--f-mono); font-weight: 500; margin-left: 4px; }
.conn { margin-left: auto; font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); display: inline-block; }
.conn.live i { background: var(--ok); }

.body { display: grid; grid-template-columns: 230px minmax(0,1fr) 340px; min-height: 0; }
.side { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.side h2, .notes h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); font-weight: 600; margin: 4px 8px 6px; }
.grp { display: grid; grid-template-columns: 10px 1fr; gap: 2px 8px; align-items: center; text-align: left; border: 0; background: transparent; border-radius: var(--r); padding: 8px; }
.grp:hover { background: var(--raise); }
.grp[aria-current="true"] { background: var(--raise); }
.grp b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp span { grid-column: 2; font-size: 12px; color: var(--mute); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.dot.review { background: var(--note); } .dot.revising { background: var(--work); } .dot.approved, .dot.posted { background: var(--ok); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 16px; gap: 10px; overflow-y: auto; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar .lbl { font-size: 12px; color: var(--mute); margin-right: 2px; }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pill .dot { width: 7px; height: 7px; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--mute); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.go { background: var(--ok); color: var(--on-accent); border-color: var(--ok); }
.btn.notes-btn { background: var(--note-soft); border-color: var(--note); color: var(--note); }
.btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.status { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--raise); color: var(--mute); }
.status.review { background: var(--note-soft); color: var(--note); }
.status.revising { background: var(--work-soft); color: var(--work); }
.status.approved, .status.posted { background: var(--ok-soft); color: var(--ok); }
.banner { border: 1px solid var(--work); background: var(--work-soft); border-radius: var(--r); padding: 8px 12px; font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.banner a { color: var(--work); font-weight: 600; }

.stage { display: flex; justify-content: center; gap: 12px; min-height: 0; }
.player { display: flex; flex-direction: column; gap: 6px; align-items: center; min-width: 0; }
.player .tag { font-size: 11.5px; color: var(--mute); font-weight: 600; }
.frame { position: relative; height: min(64vh, 720px); aspect-ratio: 9 / 16; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
.frame video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.frame .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #a9adb8; font-size: 13px; padding: 20px; }
.stage.compare .frame { height: min(56vh, 620px); }

.ctrl { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 10px; align-items: center; width: 100%; max-width: 560px; margin: 0 auto; }
.ctrl .ib { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
.ctrl .ib svg { width: 14px; height: 14px; fill: currentColor; }
.ctrl .time { font-size: 12px; color: var(--mute); white-space: nowrap; }
.ctrl .time b { color: var(--fg); font-weight: 500; }
.scrub { position: relative; height: 26px; cursor: pointer; touch-action: none; }
.scrub .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
.scrub .fill { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--fg); width: 0; }
.scrub .head { position: absolute; top: 6px; width: 2px; height: 14px; background: var(--fg); transform: translateX(-1px); left: 0; }
.mk { position: absolute; top: 0; width: 10px; height: 10px; transform: translateX(-5px) rotate(45deg); background: var(--note); border: 0; padding: 0; border-radius: 2px; }
.mk.sent { background: var(--work); } .mk.done, .mk.wontfix { background: var(--mute); opacity: .6; }
.ctrl .fr { font-size: 11px; color: var(--mute); }

.notes { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.compose { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.compose label { font-size: 12px; color: var(--mute); }
.compose label b { color: var(--note); font-family: var(--f-mono); font-weight: 500; }
.compose textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 8px 10px; box-sizing: border-box; }
.compose textarea:focus { border-color: var(--note); outline: none; }
.keys { font-size: 11px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 4px 10px; }
kbd { font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--raise); }
.list-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; font-size: 12px; color: var(--mute); }
.list-head label { margin-left: auto; display: flex; gap: 5px; align-items: center; }
.list { overflow-y: auto; padding: 0 10px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 0; flex: 1; }
.list h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 10px 4px 2px; font-weight: 600; }
.empty { color: var(--mute); text-align: center; padding: 26px 10px; font-size: 13px; }
.note { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--bg); display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: start; }
.note .t { border: 0; border-radius: 4px; padding: 1px 6px; font-size: 11.5px; background: var(--note-soft); color: var(--note); font-family: var(--f-mono); }
.note.sent .t { background: var(--work-soft); color: var(--work); }
.note.done .t, .note.wontfix .t { background: var(--raise); color: var(--mute); }
.note .txt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.note .x { border: 0; background: transparent; color: var(--mute); font-size: 16px; line-height: 1; padding: 0 2px; }
.note .x:hover { color: var(--danger); }
.note .meta { grid-column: 2 / 4; font-size: 11.5px; color: var(--mute); }
.note .reply { grid-column: 1 / 4; font-size: 12.5px; border-top: 1px dashed var(--line); padding-top: 6px; color: var(--fg); }
.note .reply b { color: var(--ok); font-weight: 600; }
.note.wontfix .reply b { color: var(--mute); }
.changes { margin: 4px; padding: 8px 10px; border-radius: var(--r); background: var(--ok-soft); font-size: 12.5px; white-space: pre-wrap; }

.welcome { max-width: 520px; margin: 6vh auto; display: flex; flex-direction: column; gap: 12px; }
.welcome h1 { font-size: 22px; margin: 0; text-wrap: balance; }
.welcome ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--mute); }
.welcome ol b { color: var(--fg); font-weight: 600; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(520px, 100%); max-height: 86vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.modal h2 { margin: 0; font-size: 17px; text-wrap: balance; }
.modal p { margin: 0; color: var(--mute); }
.modal ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.modal pre { margin: 0; white-space: pre-wrap; word-break: break-word; background: var(--raise); border-radius: 6px; padding: 10px; font: 12px/1.5 var(--f-mono); }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal .err { color: var(--danger); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 20; }

@media (max-width: 1100px) { .body { grid-template-columns: 200px minmax(0,1fr) 300px; } }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .body { grid-template-columns: minmax(0,1fr); }
  .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; gap: 6px; }
  .side h2 { display: none; }
  .grp { flex: none; border: 1px solid var(--line); }
  .main { overflow: visible; }
  .frame, .stage.compare .frame { height: min(70vh, 640px); }
  .stage.compare .frame { height: auto; width: 100%; }
  .stage.compare .player { flex: 1; }
  .notes { border-left: 0; border-top: 1px solid var(--line); }
  .list { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Edit review<small>Anton Roggo</small></div>
    <nav class="tabs" id="tabs" aria-label="Filter"></nav>
    <div class="conn" id="conn"><i></i><span>Connecting…</span></div>
  </header>
  <div class="body" id="body">
    <aside class="side" id="side" aria-label="Scripts"><h2>Scripts</h2></aside>
    <main class="main" id="main"></main>
    <section class="notes" id="notes" aria-label="Notes"></section>
  </div>
</div>
<div id="layer"></div>

<script>
(() => {
  "use strict";
  const STATUS = { review: "Ready for review", revising: "With Claude", approved: "Approved", posted: "Posted" };
  const TABS = [
    ["review", "To review", v => v.status === "review"],
    ["open", "Notes open", v => openNotes(v.id).length > 0],
    ["claude", "With Claude", v => v.status === "revising"],
    ["approved", "Approved", v => v.status === "approved" || v.status === "posted"],
    ["all", "All", () => true],
  ];
  const S = {
    db: null, live: false, videos: [], notes: [], requests: [], config: {},
    tab: "review", group: null, videoId: null, ver: null, showDone: false, compare: false, noteT: 0,
  };
  try { Object.assign(S, JSON.parse(localStorage.getItem("review-ui") || "{}")); } catch (e) {}
  const remember = () => { try { localStorage.setItem("review-ui", JSON.stringify({ tab: S.tab, group: S.group, videoId: S.videoId, showDone: S.showDone })); } catch (e) {} };

  const $ = s => document.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  };
  const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); };
  const ago = ms => { const s = (Date.now() - ms) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago"; };
  const toast = msg => { const t = h("div", { class: "toast", role: "status" }, msg); document.body.append(t); setTimeout(() => t.remove(), 2600); };

  // ---- derived data ----
  const video = id => S.videos.find(v => v.id === id);
  const notesFor = id => S.notes.filter(n => n.video === id);
  const openNotes = id => notesFor(id).filter(n => n.status === "open");
  const versions = v => (v && Array.isArray(v.versions) ? v.versions : []);
  const curVersion = v => { const vs = versions(v); return vs.find(x => x.n === S.ver) || vs[vs.length - 1]; };
  const srcOf = ver => ver ? (ver.asset ? "/_blob/" + ver.asset : ver.url || "") : "";
  const tabFilter = () => (TABS.find(t => t[0] === S.tab) || TABS[4])[2];
  function groups() {
    const f = tabFilter(), map = new Map();
    for (const v of S.videos) {
      if (!f(v)) continue;
      const key = v.group || v.id;
      if (!map.has(key)) map.set(key, { key, title: v.groupTitle || v.title || key, updated: 0 });
      map.get(key).updated = Math.max(map.get(key).updated, v.updatedAt || v.createdAt || 0);
    }
    return [...map.values()].sort((a, b) => b.updated - a.updated).map(g => {
      const cuts = S.videos.filter(v => (v.group || v.id) === g.key).sort((a, b) => String(a.cut || "").localeCompare(String(b.cut || "")));
      return { ...g, cuts };
    });
  }
  function groupDot(cuts) {
    if (cuts.some(v => v.status === "review")) return "review";
    if (cuts.some(v => v.status === "revising")) return "revising";
    if (cuts.every(v => v.status === "approved" || v.status === "posted")) return "approved";
    return "";
  }
  function fixSelection() {
    const gs = groups();
    let g = gs.find(x => x.key === S.group) || gs[0];
    S.group = g ? g.key : null;
    if (!g) { S.videoId = null; return; }
    const f = tabFilter();
    if (!g.cuts.some(v => v.id === S.videoId)) S.videoId = (g.cuts.find(f) || g.cuts[0]).id;
    const vs = versions(video(S.videoId));
    if (!vs.some(x => x.n === S.ver) || S.verFollow) { S.ver = vs.length ? vs[vs.length - 1].n : null; S.verFollow = true; }
  }

  // ---- rendering ----
  function renderTabs() {
    const el = $("#tabs"); el.replaceChildren();
    for (const [key, label, f] of TABS) {
      el.append(h("button", { class: "tab", "aria-pressed": String(S.tab === key), onclick: () => { S.tab = key; S.group = null; S.verFollow = true; remember(); renderAll(); } },
        label, h("span", { class: "n" }, S.videos.filter(f).length)));
    }
  }
  function renderSide() {
    const el = $("#side"); el.replaceChildren(h("h2", {}, "Scripts"));
    const gs = groups();
    if (!gs.length) el.append(h("div", { class: "empty" }, S.videos.length ? "Nothing in this view." : "No edits yet."));
    for (const g of gs) {
      el.append(h("button", { class: "grp", "aria-current": String(g.key === S.group), onclick: () => { S.group = g.key; S.videoId = null; S.verFollow = true; remember(); renderAll(); } },
        h("i", { class: "dot " + groupDot(g.cuts) }), h("b", {}, g.title),
        h("span", {}, g.cuts.length + (g.cuts.length === 1 ? " cut" : " cuts") + " · " + ago(g.updated))));
    }
  }

  function welcome() {
    if (!S.loaded) return h("div", { class: "welcome" }, h("p", {}, "Loading the review queue…"));
    return h("div", { class: "welcome" },
      h("h1", {}, S.db ? "No edits waiting yet" : "Open this page in Claude to review edits"),
      h("p", {}, S.db ? "When Claude finishes an edit, it uploads it here. Each script gets its cuts (Hook A, Hook B…) and every revision becomes a new version."
                      : "The review queue lives in this artifact's shared storage, which only loads inside claude.ai."),
      h("ol", {},
        h("li", {}, h("b", {}, "Brief Claude"), " with the script and footage in Dropbox."),
        h("li", {}, h("b", {}, "Watch the cut here"), " and press N to drop a note at the exact moment."),
        h("li", {}, h("b", {}, "Apply notes"), " sends them to Claude, who re-edits and uploads the next version."),
        h("li", {}, h("b", {}, "Approve"), " when it's right. Every note also becomes a rule in the brand brain, so the next edit starts better.")));
  }

  function renderMain() {
    const el = $("#main");
    const v = video(S.videoId);
    if (!v) { stopLoop(); el.replaceChildren(welcome()); renderNotes(); return; }
    const g = groups().find(x => x.key === S.group);
    const ver = curVersion(v);
    const vs = versions(v);
    const nOpen = openNotes(v.id).length;

    const cutBar = h("div", { class: "bar" }, h("span", { class: "lbl" }, g ? g.title : v.title, " · cut"),
      (g ? g.cuts : [v]).map(c => h("button", { class: "pill", "aria-pressed": String(c.id === v.id), onclick: () => { S.videoId = c.id; S.verFollow = true; remember(); renderAll(); } },
        h("i", { class: "dot " + (c.status || "") }), c.cut || c.title || c.id)));

    const approved = v.status === "approved" || v.status === "posted";
    const verBar = h("div", { class: "bar" }, h("span", { class: "lbl" }, "version"),
      vs.map(x => h("button", { class: "pill mono", "aria-pressed": String(ver && x.n === ver.n), onclick: () => { S.ver = x.n; S.verFollow = x.n === vs[vs.length - 1].n; renderMain(); } }, "v" + x.n)),
      h("span", { class: "status " + (v.status || "") }, approved ? STATUS[v.status] + " v" + (v.approvedVersion || "") : STATUS[v.status] || v.status || ""),
      h("span", { class: "spacer" }),
      h("button", { class: "btn" + (nOpen ? " notes-btn" : ""), disabled: !nOpen || !S.db, onclick: openApply }, nOpen ? "Apply " + nOpen + (nOpen === 1 ? " note" : " notes") : "Apply notes"),
      h("button", { class: "btn" + (S.compare ? " on" : ""), disabled: vs.length < 2, onclick: () => { S.compare = !S.compare; renderMain(); } }, "Compare"),
      approved
        ? h("button", { class: "btn", disabled: !S.db || v.status === "posted", onclick: reopen }, "Reopen")
        : h("button", { class: "btn go", disabled: !ver || !S.db, onclick: openApprove }, "Approve v" + (ver ? ver.n : "")));

    const kids = [cutBar, verBar];
    const req = S.requests.find(r => r.video === v.id && (r.status === "pending" || r.status === "started" || r.status === "working"));
    if (v.status === "revising" || req) {
      const b = h("div", { class: "banner" }, h("span", {}, req && req.kind === "approve" ? "Claude is publishing this cut." : "Claude is applying your notes. The next version will appear here."));
      if (req && req.createdAt) b.append(h("span", { class: "mono", style: "color:var(--mute)" }, ago(req.createdAt)));
      if (req && req.session) b.append(h("a", { href: "https://claude.ai/code/" + req.session, target: "_blank", rel: "noopener" }, "Open session"));
      else if (req) b.append(h("button", { class: "btn", onclick: () => showPrompt(promptFor(req, req.id), null) }, "Show prompt"));
      kids.push(b);
    }

    // players are reused across renders so playback never resets on a data update
    const stage = h("div", { class: "stage" + (S.compare && vs.length > 1 ? " compare" : "") });
    const prev = vs[vs.indexOf(ver) - 1] || vs[vs.length - 2];
    if (S.compare && vs.length > 1 && prev) stage.append(playerBox(P2, prev, "v" + prev.n + " (before)"));
    stage.append(playerBox(P1, ver, S.compare && vs.length > 1 ? "v" + (ver && ver.n) + " (now)" : null));
    kids.push(stage, controls());
    el.replaceChildren(...kids);
    if (!(S.compare && vs.length > 1)) P2.v.pause();
    syncTime();
    renderNotes();
  }

  // ---- player ----
  const mkPlayer = muted => {
    const v = h("video", { playsinline: true, preload: "auto" });
    v.muted = muted;
    const msg = h("div", { class: "msg", hidden: true });
    const frame = h("div", { class: "frame" }, v, msg);
    return { v, msg, frame, src: "" };
  };
  const P1 = mkPlayer(false), P2 = mkPlayer(true);
  function playerBox(P, ver, label) {
    const src = srcOf(ver);
    if (P.src !== src) { P.src = src; P.v.src = src; P.msg.hidden = !!src; P.msg.textContent = src ? "" : "This version has no video file yet."; }
    return h("div", { class: "player" }, label ? h("span", { class: "tag mono" }, label) : null, P.frame);
  }
  P1.v.addEventListener("error", () => { P1.msg.hidden = false; P1.msg.textContent = "This video can't be played here. Ask Claude to re-upload this version."; });
  P1.v.addEventListener("click", () => toggle());
  const duration = () => (isFinite(P1.v.duration) && P1.v.duration) || (curVersion(video(S.videoId)) || {}).duration || 0;
  const fps = () => (curVersion(video(S.videoId)) || {}).fps || 30;
  function toggle() { if (P1.v.paused) P1.v.play().catch(() => {}); else P1.v.pause(); }
  function seek(t) { P1.v.currentTime = Math.max(0, Math.min(duration() || 0, t)); }
  P1.v.addEventListener("play", () => { if (S.compare) P2.v.play().catch(() => {}); startLoop(); syncTime(); });
  P1.v.addEventListener("pause", () => { if (S.compare) { P2.v.pause(); P2.v.currentTime = P1.v.currentTime; } syncTime(); });
  P1.v.addEventListener("seeked", () => { if (S.compare) P2.v.currentTime = P1.v.currentTime; syncTime(); });
  P1.v.addEventListener("loadedmetadata", () => { renderMarkers(); syncTime(); });
  let raf = 0;
  function startLoop() { cancelAnimationFrame(raf); const tick = () => { syncTime(); if (!P1.v.paused) raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); }
  function stopLoop() { cancelAnimationFrame(raf); P1.v.pause(); P2.v.pause(); }

  const ICON = {
    play: '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',
    pause: '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>',
    sound: '<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>',
    mute: '<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 6l3.5 4M14.5 6L11 10" stroke="currentColor" stroke-width="1.4"/></svg>',
  };
  const C = {};
  function controls() {
    C.play = h("button", { class: "ib", "aria-label": "Play or pause (space)", onclick: toggle });
    C.time = h("span", { class: "time mono" });
    C.fill = h("div", { class: "fill" }); C.head = h("div", { class: "head" });
    C.marks = h("div");
    C.scrub = h("div", { class: "scrub", role: "slider", tabindex: "0", "aria-label": "Playhead" }, h("div", { class: "track" }), C.fill, C.marks, C.head);
    const at = e => { const r = C.scrub.getBoundingClientRect(); return (Math.min(Math.max(e.clientX - r.left, 0), r.width) / r.width) * duration(); };
    C.scrub.addEventListener("pointerdown", e => { if (e.target.classList.contains("mk")) return; C.scrub.setPointerCapture(e.pointerId); seek(at(e)); });
    C.scrub.addEventListener("pointermove", e => { if (C.scrub.hasPointerCapture(e.pointerId)) seek(at(e)); });
    C.mute = h("button", { class: "ib", "aria-label": "Mute", onclick: () => { P1.v.muted = !P1.v.muted; syncTime(); } });
    C.fr = h("span", { class: "fr mono", title: "Frame" });
    renderMarkers();
    return h("div", { class: "ctrl" }, C.play, C.time, C.scrub, C.fr, C.mute);
  }
  function syncTime() {
    if (!C.time) return;
    const t = P1.v.currentTime || 0, d = duration();
    C.time.replaceChildren(h("b", {}, fmt(t)), " / " + fmt(d));
    const p = d ? (t / d) * 100 : 0;
    C.fill.style.width = p + "%"; C.head.style.left = p + "%";
    C.play.innerHTML = P1.v.paused ? ICON.play : ICON.pause;
    C.mute.innerHTML = P1.v.muted ? ICON.mute : ICON.sound;
    C.fr.textContent = "f" + Math.round(t * fps());
    if (document.activeElement !== N.ta && N.label) N.label.textContent = fmt(t);
  }
  function renderMarkers() {
    if (!C.marks) return;
    const d = duration(), ver = curVersion(video(S.videoId));
    C.marks.replaceChildren();
    if (!d || !ver) return;
    for (const n of notesFor(S.videoId).filter(n => n.version === ver.n)) {
      if (!S.showDone && (n.status === "done" || n.status === "wontfix")) continue;
      C.marks.append(h("button", { class: "mk " + n.status, style: "left:" + (n.t / d * 100) + "%", title: fmt(n.t) + "  " + n.text, "aria-label": "Note at " + fmt(n.t), onclick: () => { P1.v.pause(); seek(n.t); } }));
    }
  }

  // ---- notes panel ----
  const N = {};
  function renderNotes() {
    const el = $("#notes");
    const v = video(S.videoId), ver = curVersion(v);
    if (!v) { el.replaceChildren(h("div", { class: "empty" }, "Notes for the selected cut show up here.")); N.ta = null; return; }
    const draft = N.ta && N.ta.value, hadFocus = N.ta && document.activeElement === N.ta;
    N.label = h("b", {}, fmt(hadFocus ? S.noteT : P1.v.currentTime));
    N.ta = h("textarea", { id: "note-text", placeholder: S.db ? "What should change here?" : "Notes save once this page is open in Claude.", "aria-label": "Note text", disabled: !S.db || !ver });
    N.ta.value = draft || "";
    N.ta.addEventListener("focus", startNote);
    const compose = h("div", { class: "compose" },
      h("label", { for: "note-text" }, "Note at ", N.label, ver ? " on v" + ver.n : ""), N.ta,
      h("div", { class: "keys" }, h("span", {}, h("kbd", {}, "N"), " new note (pauses)"), h("span", {}, h("kbd", {}, "Enter"), " save"),
        h("span", {}, h("kbd", {}, "Shift+Enter"), " new line"), h("span", {}, h("kbd", {}, "Esc"), " back to video"),
        h("span", {}, h("kbd", {}, "Space"), " play"), h("span", {}, h("kbd", {}, "←"), h("kbd", {}, "→"), " 1s, ", h("kbd", {}, ","), h("kbd", {}, "."), " 1 frame")));

    const all = notesFor(v.id).sort((a, b) => a.t - b.t);
    const here = all.filter(n => ver && n.version === ver.n && (S.showDone || n.status === "open" || n.status === "sent"));
    const fixed = ver ? all.filter(n => n.fixedIn === ver.n && n.version !== ver.n) : [];
    const doneCount = all.filter(n => n.status === "done" || n.status === "wontfix").length;
    const openCount = all.filter(n => n.status === "open").length;
    const head = h("div", { class: "list-head" }, h("span", {}, openCount + " open · " + doneCount + " done on " + (v.cut || v.title || "this cut")),
      h("label", {}, h("input", { type: "checkbox", id: "show-done", checked: S.showDone, onchange: e => { S.showDone = e.target.checked; remember(); renderNotes(); renderMarkers(); } }), "show done"));

    const list = h("div", { class: "list" });
    if (ver && ver.changes) list.append(h("h3", {}, "What changed in v" + ver.n), h("div", { class: "changes" }, ver.changes));
    if (fixed.length) { list.append(h("h3", {}, "Your notes from v" + (ver.n - 1) + " (check these)")); fixed.forEach(n => list.append(noteEl(n))); }
    if (here.length) { if (fixed.length || (ver && ver.changes)) list.append(h("h3", {}, "Notes on v" + ver.n)); here.forEach(n => list.append(noteEl(n))); }
    if (!here.length && !fixed.length) list.append(h("div", { class: "empty" }, S.db ? "No open notes on this cut. Press N while watching to add one." : "Notes load once this page is open in Claude."));
    el.replaceChildren(compose, head, list);
    if (hadFocus) { N.ta.focus(); N.label.textContent = fmt(S.noteT); }
    renderMarkers();
  }
  function noteEl(n) {
    const st = { open: "open", sent: "with Claude", done: "done", wontfix: "not changed" }[n.status] || n.status;
    const el = h("div", { class: "note " + n.status },
      h("button", { class: "t", title: "Jump to " + fmt(n.t), onclick: () => { P1.v.pause(); seek(n.t); } }, fmt(n.t)),
      h("div", { class: "txt" }, n.text),
      n.status === "open" && S.db ? h("button", { class: "x", "aria-label": "Delete note", title: "Delete", onclick: () => S.db.doc("notes/" + n.id).delete().catch(dbErr) }, "×") : h("span"),
      h("div", { class: "meta" }, "v" + n.version + " · " + st + (n.createdAt ? " · " + ago(n.createdAt) : "")));
    if (n.reply) el.append(h("div", { class: "reply" }, h("b", {}, n.status === "wontfix" ? "Claude, not changed: " : "Claude: "), n.reply));
    return el;
  }
  function startNote() {
    if (!N.ta || N.ta.disabled) return;
    P1.v.pause();
    S.noteT = Math.round((P1.v.currentTime || 0) * 10) / 10;
    if (N.label) N.label.textContent = fmt(S.noteT);
    if (document.activeElement !== N.ta) N.ta.focus();
  }
  let saving = false;
  async function saveNote() {
    const text = N.ta.value.trim(), v = video(S.videoId), ver = curVersion(v);
    if (!text || !v || !ver || !S.db || saving) return;
    saving = true;
    try {
      await S.db.collection("notes").add({ video: v.id, version: ver.n, t: S.noteT, text, status: "open", createdAt: Date.now() });
      N.ta.value = "";
      toast("Note saved at " + fmt(S.noteT));
    } catch (e) { dbErr(e); } finally { saving = false; }
  }
  function dbErr(e) {
    const code = e && e.code;
    toast(code === "invalid_argument" ? "You can view this review but not change it." : code === "quota_exceeded" ? "Storage is full. Ask Claude to archive old reviews." : "Couldn't save. Check your connection and try again.");
  }

  // ---- actions: apply notes, approve ----
  function modal(...kids) {
    const close = () => $("#layer").replaceChildren();
    const box = h("div", { class: "modal", role: "dialog", "aria-modal": "true" }, ...kids);
    const ov = h("div", { class: "overlay", onclick: e => { if (e.target === ov) close(); } }, box);
    $("#layer").replaceChildren(ov);
    const first = box.querySelector("button.go, button.notes-btn, button");
    if (first) first.focus();
    return close;
  }
  function promptFor(req, id) {
    const v = video(req.video) || {};
    const name = (v.groupTitle || v.title || req.video) + " · " + (v.cut || "");
    const what = req.kind === "approve"
      ? `Anton approved v${req.version} of "${name}" (video id ${req.video}). Publish it.`
      : `Apply Anton's ${req.notes ? req.notes.length : ""} notes on v${req.version} of "${name}" (video id ${req.video}) and upload v${req.version + 1}.`;
    return `Review tool request ${id}. ${what}\nFollow .claude/skills/review/SKILL.md.` + (S.config.artifactUrl ? `\nReview tool: ${S.config.artifactUrl}` : "");
  }
  function sessionIdFrom(x) { const m = JSON.stringify(x || "").match(/session_[A-Za-z0-9]+/); return m ? m[0] : null; }
  async function launch(req, id) {
    const prompt = promptFor(req, id), cfg = S.config;
    if (!cfg.autoLaunch || !cfg.environmentId || !cfg.repoUrl) return showPrompt(prompt, null);
    const mcp = window.claude ? await window.claude.use("mcp") : null;
    if (!mcp) return showPrompt(prompt, "Starting Claude from this page isn't available here.");
    const v = video(req.video) || {};
    const input = { prompt, title: (req.kind === "approve" ? "Publish: " : "Notes: ") + (v.groupTitle || v.title || req.video) + " " + (v.cut || "") + " v" + req.version,
      environment_id: cfg.environmentId, source_url: cfg.repoUrl, tags: ["review-tool"] };
    if (cfg.branch) { input.source_revision = cfg.branch; input.outcome_branch = cfg.branch; }
    if (cfg.permissionMode) input.permission_mode = cfg.permissionMode;
    toast("Starting Claude…");
    try {
      const r = await mcp.callTool("Claude Code Remote", "create_session", input);
      const sid = sessionIdFrom(r.payload !== undefined ? r.payload : r.content);
      await S.db.doc("requests/" + id).update({ status: "started", session: sid, startedAt: Date.now() });
      toast("Claude is on it");
    } catch (e) {
      const why = {
        server_not_connected: "Claude Code Remote isn't connected for your account.",
        needs_reauth: "Reconnect Claude Code Remote in claude.ai Settings → Connectors.",
        not_in_manifest: "You turned off starting Claude for this page.",
        approval_required: "Starting Claude needs your approval. Try again and choose Allow.",
        tool_error: "Claude couldn't start: " + (e && e.message || ""),
      }[e && e.code] || "Claude couldn't be started from here (" + (e && e.code || "error") + ").";
      showPrompt(prompt, why);
    }
  }
  function showPrompt(prompt, why) {
    const pre = h("pre", { id: "prompt-text" }, prompt);
    const close = modal(
      h("h2", {}, "Send this to Claude"),
      why ? h("p", { class: "err" }, why) : null,
      h("p", {}, "Your request is saved. Paste this into a Claude Code session on the AntonRoggo repo and it will pick it up."),
      pre,
      h("div", { class: "row" },
        h("a", { class: "btn", href: "https://claude.ai/code", target: "_blank", rel: "noopener" }, "Open Claude Code"),
        h("button", { class: "btn go", onclick: async () => {
          try { await navigator.clipboard.writeText(prompt); toast("Copied"); close(); }
          catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl/Cmd+C"); }
        } }, "Copy prompt")));
  }
  function openApply() {
    const v = video(S.videoId); if (!v) return;
    const ns = openNotes(v.id).sort((a, b) => a.version - b.version || a.t - b.t);
    if (!ns.length) return;
    const ver = Math.max(...ns.map(n => n.version));
    const close = modal(
      h("h2", {}, "Send " + ns.length + (ns.length === 1 ? " note" : " notes") + " to Claude?"),
      h("p", {}, "Claude re-edits " + (v.cut || v.title) + " and uploads v" + (ver + 1) + " here. Each note also becomes a rule in editing-lessons.md."),
      h("ul", {}, ns.map(n => h("li", {}, h("span", { class: "mono" }, fmt(n.t) + "  "), n.text))),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => close() }, "Keep editing"),
        h("button", { class: "btn notes-btn", onclick: async e => {
          e.target.disabled = true;
          try {
            const req = { kind: "revise", video: v.id, version: ver, notes: ns.map(n => n.id), status: "pending", createdAt: Date.now() };
            const ref = await S.db.collection("requests").add(req);
            for (const n of ns) await S.db.doc("notes/" + n.id).update({ status: "sent", request: ref.id });
            await S.db.doc("videos/" + v.id).update({ status: "revising", updatedAt: Date.now() });
            close(); S.tab = S.tab === "review" || S.tab === "open" ? "claude" : S.tab; S.group = v.group || v.id; S.videoId = v.id; remember(); renderAll();
            launch(req, ref.id);
          } catch (err) { e.target.disabled = false; dbErr(err); }
        } }, "Apply notes")));
  }
  function openApprove() {
    const v = video(S.videoId), ver = curVersion(v); if (!v || !ver) return;
    const nOpen = openNotes(v.id).length;
    const close = modal(
      h("h2", {}, "Approve v" + ver.n + " of " + (v.groupTitle || v.title) + " · " + (v.cut || "") + "?"),
      h("p", {}, "This is your sign-off on this exact version. Claude uploads it to Dropbox and schedules it on your platforms following the publishing plan (trial reels first)."),
      nOpen ? h("p", { class: "err" }, nOpen + (nOpen === 1 ? " note is" : " notes are") + " still open on this cut and won't be applied.") : null,
      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => close() }, "Not yet"),
        h("button", { class: "btn go", onclick: async e => {
          e.target.disabled = true;
          try {
            const req = { kind: "approve", video: v.id, version: ver.n, status: "pending", createdAt: Date.now() };
            const ref = await S.db.collection("requests").add(req);
            await S.db.doc("videos/" + v.id).update({ status: "approved", approvedVersion: ver.n, approvedAt: Date.now(), updatedAt: Date.now() });
            close(); toast("Approved v" + ver.n); renderAll();
            launch(req, ref.id);
          } catch (err) { e.target.disabled = false; dbErr(err); }
        } }, "Approve v" + ver.n)));
  }
  async function reopen() {
    const v = video(S.videoId); if (!v || !S.db) return;
    try { await S.db.doc("videos/" + v.id).update({ status: "review", updatedAt: Date.now() }); toast("Back in review. Claude won't post it unless you approve again."); }
    catch (e) { dbErr(e); }
  }

  // ---- keyboard ----
  document.addEventListener("keydown", e => {
    if ($("#layer").firstChild) { if (e.key === "Escape") $("#layer").replaceChildren(); return; }
    const typing = e.target === N.ta;
    if (typing) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNote(); }
      else if (e.key === "Escape") { e.preventDefault(); N.ta.blur(); C.scrub && C.scrub.focus(); }
      return;
    }
    if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const step = 1 / fps();
    if (e.key === "n" || e.key === "N") { e.preventDefault(); startNote(); }
    else if (e.key === " " || e.key === "k") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); seek(P1.v.currentTime - (e.shiftKey ? step : 1)); }
    else if (e.key === "ArrowRight") { e.preventDefault(); seek(P1.v.currentTime + (e.shiftKey ? step : 1)); }
    else if (e.key === ",") { P1.v.pause(); seek(P1.v.currentTime - step); }
    else if (e.key === ".") { P1.v.pause(); seek(P1.v.currentTime + step); }
  });

  function renderAll() { fixSelection(); renderTabs(); renderSide(); renderMain(); }
  function setConn(live, text) { const c = $("#conn"); c.classList.toggle("live", live); c.lastChild.textContent = text; }

  // ---- data ----
  renderAll();
  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    if (!db) { S.loaded = true; setConn(false, "Offline preview"); renderAll(); return; }
    S.db = db; setConn(true, "Live");
    const onErr = e => setConn(false, e && e.code === "revoked" ? "Access changed" : "Reconnect by reloading");
    const rows = snap => snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
    db.collection("videos").onSnapshot(s => { S.videos = rows(s); S.loaded = true; renderAll(); }, onErr);
    db.collection("notes").onSnapshot(s => { S.notes = rows(s); renderAll(); }, onErr);
    db.collection("requests").orderBy("createdAt", "desc").limit(100).onSnapshot(s => { S.requests = rows(s); if (video(S.videoId)) renderMain(); }, onErr);
    db.doc("config/main").onSnapshot(s => { S.config = s.exists ? s.data() : {}; }, onErr);
  })();
})();
</script>
